[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-rinse-repeat-v1"
version = "0.2.0"
description = "Rules-first, scoring-second BTC paper trading decision engine"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
